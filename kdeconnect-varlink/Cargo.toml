[package]
name = "kdeconnect-varlink"
version = "0.1.0"
edition = "2021"

[dependencies]
varlink = { version = "13", features = ["tokio"] }
varlink_derive = "13"
serde = "1"
serde_derive = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

[build-dependencies]
varlink_generator = "13"